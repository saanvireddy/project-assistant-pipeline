name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Run ETL pipeline (smoke test)
        run: |
          cd etl
          python country_standardizer.py

      - name: Run schema/quality checks (smoke test)
        run: |
          cd modules
          python -c "
          import sys; sys.path.insert(0, '.')
          import pandas as pd
          from quality_checks import run_quality_report
          df = pd.read_csv('../data/processed/standardized_countries.csv')
          report = run_quality_report(df, missing_check_columns=['country_name'], duplicate_subset=['record_id'])
          print('Quality check passed:', report['passed'])
          "